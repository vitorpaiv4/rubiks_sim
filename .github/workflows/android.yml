name: Build Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'assets/**'
      - 'res/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install Android Platform & Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-30" "build-tools;34.0.0"

      - name: Generate Release Keystore if needed
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias rubikssim -keyalg RSA -keysize 2048 -validity 10000 -storepass rubiks_password -keypass rubiks_password -dname "CN=RubiksSim, OU=Games, O=Personal, L=City, ST=State, C=BR"
          fi

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          unset ANDROID_SDK_ROOT || true
          cargo apk build --release

      - name: Copy APK to root
        run: |
          find target/ -name "*.apk" -exec cp {} ./rubiks_sim-android.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubiks_sim-android
          path: rubiks_sim-android.apk

      - name: Upload APK to latest release if exists
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rubiks_sim-android.apk
          draft: false
          prerelease: false
