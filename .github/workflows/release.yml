name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rubiks_sim-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rubiks_sim-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rubiks_sim-macos-apple-silicon
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: rubiks_sim-macos-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config file libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux (AppImage + tar.gz)
        if: runner.os == 'Linux'
        run: |
          # 1. Package tar.gz
          mkdir staging
          cp target/${{ matrix.target }}/release/rubiks_sim staging/
          cp README.md staging/
          cp icon.png staging/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging .

          # 2. Build AppImage (Portable 1-click executable)
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/${{ matrix.target }}/release/rubiks_sim AppDir/usr/bin/
          cp icon.png AppDir/rubiks_sim.png
          cp icon.png AppDir/.DirIcon
          cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/rubiks_sim.png
          cp icon.png AppDir/usr/share/icons/hicolor/512x512/apps/rubiks_sim.png
          cp rubiks_sim.desktop AppDir/

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/rubiks_sim" "$@"
          EOF
          chmod +x AppDir/AppRun

          curl -sL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir ${{ matrix.artifact_name }}.AppImage

      - name: Package Windows (.exe + .zip)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Direct 1-click standalone executable
          cp target/${{ matrix.target }}/release/rubiks_sim.exe ./${{ matrix.artifact_name }}.exe

          # Zip package with docs
          mkdir staging
          cp target/${{ matrix.target }}/release/rubiks_sim.exe staging/
          cp README.md staging/
          cp icon.png staging/
          7z a ${{ matrix.artifact_name }}.zip ./staging/*

      - name: Package macOS (.zip)
        if: runner.os == 'macOS'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rubiks_sim staging/
          cp README.md staging/
          cp icon.png staging/
          zip -r ${{ matrix.artifact_name }}.zip staging

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.AppImage
            *.exe
            *.tar.gz
            *.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload artifact for manual workflow run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.AppImage
            *.exe
            *.tar.gz
            *.zip

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build Android APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo apk build --release

      - name: Copy APK to root
        run: |
          find target/ -name "*.apk" -exec cp {} ./rubiks_sim-android.apk \;

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rubiks_sim-android.apk
          draft: false
          prerelease: false

      - name: Upload APK for manual workflow run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: rubiks_sim-android
          path: rubiks_sim-android.apk
