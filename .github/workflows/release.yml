name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rubiks_sim-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rubiks_sim-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rubiks_sim-macos-apple-silicon
            archive_ext: zip
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: rubiks_sim-macos-intel
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rubiks_sim staging/
          cp README.md staging/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging .

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rubiks_sim.exe staging/
          cp README.md staging/
          7z a ${{ matrix.artifact_name }}.zip ./staging/*

      - name: Package binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rubiks_sim staging/
          cp README.md staging/
          zip -r ${{ matrix.artifact_name }}.zip staging

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.tar.gz
            *.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload artifact for manual workflow run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
